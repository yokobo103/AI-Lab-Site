<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>MediaPipe Pose 棒人間デモ</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    #container {
      position: relative;
      width: 640px;
      height: 480px;
    }

    video,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      /* 自撮りっぽく左右反転 */
      transform: scaleX(-1);
    }

    video {
      opacity: 0.25; /* 背景としてうっすら見える程度（棒人間を目立たせる） */
    }

    #status {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.8;
    }

    button {
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      background: #2d8cff;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>MediaPipe Pose で棒人間アバター</h1>
  <div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>
  </div>
  <button id="startButton">Webカメラ開始</button>
  <div id="status">モデル読み込み中…</div>

  <!-- ここからスクリプト。type="module" でESM importを使う -->
  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver,
      DrawingUtils,
    } from "https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.0";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const startButton = document.getElementById("startButton");

    let poseLandmarker = null;
    let runningMode = "VIDEO";
    let lastVideoTime = -1;
    let webcamRunning = false;

    // 棒人間を描くための DrawingUtils インスタンス
    const drawingUtils = new DrawingUtils(ctx);

    // 1) PoseLandmarker の初期化
    async function initPoseLandmarker() {
      statusEl.textContent = "モデル読み込み中…";

      // WASMファイルの場所を指定してFilesetResolverを作成
      // 公式ガイド推奨のCDNルートを使用
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );

      // 軽量版モデル（lite）をGoogleのストレージから直接読み込む
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "GPU",
        },
        runningMode, // "VIDEO"
        numPoses: 1,
      });

      statusEl.textContent = "モデル準備完了。Webカメラを開始してください。";
      startButton.disabled = false;
    }

    // 2) Webカメラを開始
    async function startWebcam() {
      if (!poseLandmarker) {
        statusEl.textContent = "モデルがまだ読み込み中です…";
        return;
      }

      if (webcamRunning) {
        // 停止ロジックを入れたければここに書く（今回は簡略化）
        return;
      }

      webcamRunning = true;
      startButton.disabled = true;
      statusEl.textContent = "Webカメラ起動中…";

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 },
        audio: false,
      });

      video.srcObject = stream;

      video.addEventListener(
        "loadeddata",
        () => {
          statusEl.textContent = "ポーズ推定中…動いてみてください。";
          requestAnimationFrame(predictWebcam);
        },
        { once: true }
      );
    }

    // 3) 毎フレームごとにポーズ推定＋棒人間描画
    async function predictWebcam() {
      if (!webcamRunning) return;
      if (!poseLandmarker) {
        requestAnimationFrame(predictWebcam);
        return;
      }

      const nowInMs = performance.now();

      // 不要な重複処理を減らすため、前フレームと時間が同じならスキップ
      if (video.currentTime === lastVideoTime) {
        requestAnimationFrame(predictWebcam);
        return;
      }
      lastVideoTime = video.currentTime;

      poseLandmarker.detectForVideo(video, nowInMs, (result) => {
        // 背景のカメラ映像を描く（うっすら見せたいのでopacityはCSS側で調整）
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Canvas側は反転ではなく、座標としてそのまま描く。
        // 描画時にscaleX(-1)してもOKだけど、今回はvideoだけ反転している想定。
        // （棒人間は「左右が逆」の状態で乗るけど見た目としては違和感少なめ）

        // 棒人間描画
        ctx.save();
        // Canvasも左右反転させて、自撮りっぽい向きを揃える
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);

        // ランドマークは正規化座標（0〜1）なので、キャンバスサイズに合わせて変換
        const landmarksArray = result.landmarks;
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#00ff88";
        ctx.fillStyle = "#ffffff";

        for (const landmarks of landmarksArray) {
          // DrawingUtilsを使って、MediaPipe標準の骨格ラインを描画
          drawingUtils.drawConnectors(
            landmarks,
            PoseLandmarker.POSE_CONNECTIONS,
            { lineWidth: 3 }
          );
          drawingUtils.drawLandmarks(landmarks, { radius: 3 });
        }

        ctx.restore();
      });

      requestAnimationFrame(predictWebcam);
    }

    // ボタンイベント設定
    startButton.addEventListener("click", startWebcam);

    // ページ読み込み時にモデル初期化を開始
    initPoseLandmarker().catch((err) => {
      console.error(err);
      statusEl.textContent = "モデルの読み込みに失敗しました。";
    });
  </script>
</body>
</html>
