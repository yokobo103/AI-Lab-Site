<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Hand Magic (Barrier & Directional Fire)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    video {
      display: none;
    }
  </style>
</head>
<body>
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    /****************************************************
     * 炎スプライト読み込み
     * fire_sprite.png: 1280x720, 横10コマ → 1フレーム128x720
     ****************************************************/
      const fireSprite = new Image();
      fireSprite.src = "ar_images/fireball_1x12.png";  // 前処理後のやつ
      const FRAME_COUNT = 12;
      let spriteLoaded = false;
      fireSprite.onload = () => { spriteLoaded = true; };


    /****************************************************
     * 指の状態・本数を取得（左右判定つき）
     ****************************************************/
    function getFingerStates(landmarks, handedness) {
      let thumb = false;
      let index = false;
      let middle = false;
      let ring = false;
      let pinky = false;

      // 親指 x 方向で判定（左右で向きが逆）
      const thumbTip = landmarks[4];
      const thumbIP  = landmarks[3];
      if (handedness === "Right") {
        thumb = thumbTip.x < thumbIP.x - 0.02;
      } else {
        thumb = thumbTip.x > thumbIP.x + 0.02;
      }

      // 他4本は「tip が base より上」にあれば伸びている
      const above = (tipIdx, baseIdx) => {
        const tip  = landmarks[tipIdx];
        const base = landmarks[baseIdx];
        return tip.y < base.y - 0.01;
      };

      index  = above(8, 5);   // 人差し指
      middle = above(12, 9);  // 中指
      ring   = above(16, 13); // 薬指
      pinky  = above(20, 17); // 小指

      const count = [thumb, index, middle, ring, pinky].filter(Boolean).length;
      return { thumb, index, middle, ring, pinky, count };
    }

    /****************************************************
     * 炎の弾 管理（方向付き＆スプライト描画）
     ****************************************************/
    const fireballs = [];
    const fireCooldown = {}; // 手ごとのクールダウン用

    function spawnFireball(handKey, x, y, dirX, dirY) {
      const now = performance.now();
      const last = fireCooldown[handKey] || 0;
      if (now - last < 120) return; // 連射しすぎ防止
      fireCooldown[handKey] = now;

      const speed = 18;
      fireballs.push({
        x: x + dirX * 30,
        y: y + dirY * 30,
        vx: dirX * speed,
        vy: dirY * speed,
        frame: 0,
        life: 60
      });
    }

    function drawFireballs(ctx) {
      if (!spriteLoaded) return;

      const frameW = fireSprite.width / FRAME_COUNT;
      const frameH = fireSprite.height;  // もう縮小済み

      ctx.save();
      ctx.globalCompositeOperation = "screen"; // やわらかめ

      for (let i = fireballs.length - 1; i >= 0; i--) {
        const b = fireballs[i];

        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        b.frame = (b.frame + 1) % FRAME_COUNT;

        const sx = frameW * b.frame;
        const sy = 0;

        ctx.drawImage(
          fireSprite,
          sx, sy, frameW, frameH,
          b.x - frameW / 2,
          b.y - frameH / 2,
          frameW, frameH
        );

        if (b.life <= 0) {
          fireballs.splice(i, 1);
        }
      }

      ctx.restore();
    }


    /****************************************************
     * バリア描画（barrier1/2 スプライト）
     * barrier1_1x9.png: 開閉に使用（順／逆再生）
     * barrier2_1x9.png: 維持中ループに使用
     ****************************************************/
    const barrierOpenSprite = new Image(); // 開→閉（順・逆）
    const barrierLoopSprite = new Image(); // 維持ループ
    barrierOpenSprite.src = "ar_images/barrier1_1x9.png";
    barrierLoopSprite.src = "ar_images/barrier2_1x9.png";

    const BARRIER_FRAME_COUNT = 9;
    const BARRIER_FRAME_MS = 70; // 1コマあたり約70ms
    const BARRIER_SIZE = 320;

    // handKey -> { x, y, phase, frame, last, hold }
    // phase: "opening" | "holding"
    const shields = new Map();

    function ensureShield(handKey, x, y, t) {
      let s = shields.get(handKey);
      if (!s) {
        s = { x, y, phase: "opening", frame: 0, last: t, hold: true };
        shields.set(handKey, s);
        return;
      }
      s.x = x;
      s.y = y;
      s.hold = true;
      // 閉じ途中で再度パーになった場合は開きへ戻す
      if (s.phase === "closing") {
        s.phase = "opening";
        s.frame = Math.max(0, BARRIER_FRAME_COUNT - 1 - s.frame);
        s.last = t;
      }
    }

    function releaseShield(handKey) {
      // 誤作動で残るのを避けるため即座に消す
      shields.delete(handKey);
    }

    function drawBarrierFrame(ctx, img, frameIndex, cx, cy) {
      if (!img.complete || img.naturalWidth === 0) return;
      const frameW = img.width / BARRIER_FRAME_COUNT;
      const frameH = img.height;
      const sx = frameW * frameIndex;
      const sy = 0;
      const size = BARRIER_SIZE;
      const x = cx - size / 2;
      const y = cy - size / 2;
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.globalCompositeOperation = "screen";
      ctx.drawImage(img, sx, sy, frameW, frameH, x, y, size, size);
      ctx.restore();
    }

    function drawShields(ctx, t) {
      for (const [key, s] of shields) {
        const step = Math.floor((t - s.last) / BARRIER_FRAME_MS);
        if (step > 0) {
          s.last = t;
          if (s.phase === "opening") {
            s.frame = Math.min(BARRIER_FRAME_COUNT - 1, s.frame + step);
            if (s.frame >= BARRIER_FRAME_COUNT - 1 && s.hold) {
              s.phase = "holding";
              s.frame = 0;
            }
          } else if (s.phase === "holding") {
            s.frame = (s.frame + step) % BARRIER_FRAME_COUNT;
          }
        }

        let sprite, frameIdx;
        if (s.phase === "opening") {
          sprite = barrierOpenSprite;
          frameIdx = s.frame;
        }
        else { // holding
          sprite = barrierLoopSprite;
          frameIdx = s.frame;
        }

        drawBarrierFrame(ctx, sprite, frameIdx, s.x, s.y);
      }
    }

    /****************************************************
     * メイン処理
     ****************************************************/
    window.onload = async () => {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7, // 誤検出を減らす
        minTrackingConfidence: 0.7
      });

      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 640,
        height: 480
      });
      camera.start();

      // オープン判定の連続フレームを数える
      const openCounters = new Map(); // handKey -> count

      function onResults(results) {
        const t = performance.now();

        // 1. カメラ映像を左右反転しつつアスペクト比維持で描画
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);

        const videoW = video.videoWidth || 640;
        const videoH = video.videoHeight || 480;
        const scale = Math.min(canvas.width / videoW, canvas.height / videoH);
        const drawW = videoW * scale;
        const drawH = videoH * scale;
        const offsetX = (canvas.width - drawW) / 2;
        const offsetY = (canvas.height - drawH) / 2;

        ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
        ctx.restore();

        // 2. エフェクト描画
        drawFireballs(ctx);
        drawShields(ctx, t);

        // 3. 手検出結果を処理
        if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
          const seenHands = new Set();

          for (let i = 0; i < results.multiHandLandmarks.length; i++) {
            const lm = results.multiHandLandmarks[i];
            const handedness = results.multiHandedness[i].label; // "Right" / "Left"

            const states = getFingerStates(lm, handedness);
            const count = states.count;

            // 手の基準位置（人差し指付け根）と先端（向き用）
            const baseX = lm[5].x * drawW + offsetX;
            const baseY = lm[5].y * drawH + offsetY;
            const tipX  = lm[8].x * drawW + offsetX;
            const tipY  = lm[8].y * drawH + offsetY;

            // 反転後のスクリーン座標
            const screenBaseX = canvas.width - baseX;
            const screenBaseY = baseY;
            const screenTipX  = canvas.width - tipX;
            const screenTipY  = tipY;

            // 向きベクトル（手の位置→指先）
            let dirX = screenTipX - screenBaseX;
            let dirY = screenTipY - screenBaseY;
            const len = Math.hypot(dirX, dirY) || 1;
            dirX /= len;
            dirY /= len;

            // デバッグ用の数字表示
            ctx.font = "32px sans-serif";
            ctx.fillStyle = "rgba(255,255,255,0.95)";
            ctx.strokeStyle = "rgba(0,0,0,0.7)";
            ctx.lineWidth = 4;
            ctx.strokeText(count, screenBaseX + 20, screenBaseY - 24);
            ctx.fillText(count, screenBaseX + 20, screenBaseY - 24);

            // 位置マーカー
            ctx.beginPath();
            ctx.arc(screenBaseX, screenBaseY, 6, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,255,255,0.8)";
            ctx.fill();

            const handKey = `${handedness}_${i}`;
            const isOpenHand =
              states.index && states.middle && states.ring && states.pinky;
            const isPeace =
              states.index &&
              states.middle &&
              !states.ring &&
              !states.pinky;

            // パー → シールド発動
            if (isOpenHand) {
              seenHands.add(handKey);
              const prev = openCounters.get(handKey) || 0;
              const nowCnt = Math.min(prev + 1, 10);
              openCounters.set(handKey, nowCnt);
              if (nowCnt >= 3) {
                ensureShield(handKey, screenBaseX, screenBaseY, t);
              }
            } else {
              openCounters.set(handKey, 0);
              releaseShield(handKey);
            }

            // チョキ → 手の向きに炎魔法
            if (isPeace) {
              spawnFireball(handKey, screenBaseX, screenBaseY, dirX, dirY);
            }
          }

          // パーをやめた手のシールドはフェードアウトへ
          for (const key of shields.keys()) {
            if (!seenHands.has(key)) {
              releaseShield(key);
              openCounters.delete(key);
            }
          }
        } else {
          // 手が全く検出されないフレームで残留バリアをクリア
          shields.clear();
          openCounters.clear();
        }
      }
    };
  </script>
</body>
</html>
