<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Hand Magic (Barrier & Directional Fire)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    video {
      display: none;
    }
  </style>
</head>
<body>
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    /****************************************************
     * ・ｽE・ｽe・ｽE・ｽX・ｽE・ｽv・ｽE・ｽ・ｽE・ｽ・ｽE・ｽC・ｽE・ｽg・ｽE・ｽﾇみ搾ｿｽ・ｽE・ｽ・ｽE・ｽ
     ****************************************************/
      const fireSprite    = new Image(); // 12・ｽE・ｽR・ｽE・ｽ}
      const waterSprite   = new Image(); // 9・ｽE・ｽR・ｽE・ｽ}
      const thunderSprite = new Image(); // 9・ｽE・ｽR・ｽE・ｽ}
      const toxicSprite   = new Image(); // 9・ｽE・ｽR・ｽE・ｽ}

      fireSprite.src    = "ar_images/fireball_1x12.png";
      waterSprite.src   = "ar_images/waterball_1x9.png";
      thunderSprite.src = "ar_images/thunder2_1x9.png";
      toxicSprite.src   = "ar_images/toxicball_1x9_transparent.png";

      const FIRE_FRAME_COUNT = 12;
      const NINE_FRAME_COUNT = 9;

    /****************************************************
     * ・ｽE・ｽw・ｽE・ｽﾌ擾ｿｽﾔと本・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ謫ｾ・ｽE・ｽi・ｽE・ｽ・ｽE・ｽ・ｽE・ｽE・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽﾂゑｿｽ・ｽE・ｽj
     ****************************************************/
    function getFingerStates(landmarks, handedness) {
      let thumb = false;
      let index = false;
      let middle = false;
      let ring = false;
      let pinky = false;

      // ・ｽE・ｽe・ｽE・ｽw・ｽE・ｽﾍ包ｿｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽﾅ費ｿｽ・ｽE・ｽ・ｽE・ｽi・ｽE・ｽ・ｽE・ｽ・ｽE・ｽE・ｽE・ｽﾅ鯉ｿｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽt・ｽE・ｽj
      const thumbTip = landmarks[4];
      const thumbIP  = landmarks[3];
      if (handedness === "Right") {
        thumb = thumbTip.x < thumbIP.x - 0.02;
      } else {
        thumb = thumbTip.x > thumbIP.x + 0.02;
      }

      // ・ｽE・ｽ・ｽE・ｽ4・ｽE・ｽ{・ｽE・ｽﾍ「tip ・ｽE・ｽ・ｽE・ｽ base ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽv・ｽE・ｽﾉゑｿｽ・ｽE・ｽ・ｽE・ｽﾎ伸・ｽE・ｽﾑてゑｿｽ・ｽE・ｽ・ｽE・ｽ
      const above = (tipIdx, baseIdx) => {
        const tip  = landmarks[tipIdx];
        const base = landmarks[baseIdx];
        return tip.y < base.y - 0.01;
      };

      index  = above(8, 5);
      middle = above(12, 9);
      ring   = above(16, 13);
      pinky  = above(20, 17);

      const count = [thumb, index, middle, ring, pinky].filter(Boolean).length;
      return { thumb, index, middle, ring, pinky, count };
    }


    /****************************************************
     * ・ｽe・ｽﾌ撰ｿｽ・ｽ・ｽ・ｽ・ｽ・ｽ`・ｽ・ｽi・ｽ・ｽ・ｽ・ｽ・ｽt・ｽ・ｽ・ｽj
     ****************************************************/
    const projectiles = [];
    const projectileCooldown = {}; // ・ｽ閧ｲ・ｽﾆのク・ｽ[・ｽ・ｽ・ｽ_・ｽE・ｽ・ｽ・ｽp
    const lastDirs = new Map();    // handKey -> {x,y}

    const PROJECTILE_SPEED = 18;
    const PROJECTILE_LIFE = 60;

    function isSpriteReady(img) {
      return img && img.complete && img.naturalWidth > 0;
    }

    function resolveDir(handKey, dirX, dirY, allowUpdate = true) {
      const len = Math.hypot(dirX, dirY);
      if (len > 0.2 && allowUpdate) {
        const nx = dirX / len;
        const ny = dirY / len;
        lastDirs.set(handKey, { x: nx, y: ny });
        return { x: nx, y: ny };
      }
      return lastDirs.get(handKey) || { x: 0, y: -1 }; // ・ｽf・ｽt・ｽH・ｽ・ｽ・ｽg・ｽ・ｽ・ｽ・ｽ・ｽ
    }

    function spawnProjectile(handKey, x, y, dirX, dirY, sprite, frameCount, allowUpdate = true) {
      if (!isSpriteReady(sprite)) return;
      const now = performance.now();
      const last = projectileCooldown[handKey] || 0;
      if (now - last < 120) return; // ・ｽA・ｽﾋゑｿｽ・ｽ・ｽ・ｽ・ｽ・ｽh・ｽ~
      projectileCooldown[handKey] = now;

      const d = resolveDir(handKey, dirX, dirY, allowUpdate);

      projectiles.push({
        x: x + d.x * 30,
        y: y + d.y * 30,
        vx: d.x * PROJECTILE_SPEED,
        vy: d.y * PROJECTILE_SPEED,
        frame: 0,
        life: PROJECTILE_LIFE,
        sprite,
        frameCount,
        bounced: false,
      });
    }

        function drawProjectiles(ctx, shields) {
      ctx.save();

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        if (!isSpriteReady(p.sprite)) {
          projectiles.splice(i, 1);
          continue;
        }

        const isToxic = p.sprite === toxicSprite;
        ctx.globalCompositeOperation = isToxic ? "source-over" : "screen";
        ctx.filter = isToxic ? "saturate(1.8) brightness(1.2)" : "none";

        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.frame = (p.frame + 1) % p.frameCount;

        // ?????????
        let blocked = false;
        let ringColor = "rgba(120, 200, 255, 0.55)";
        if (p.sprite === fireSprite) ringColor = "rgba(255, 150, 60, 0.60)";
        else if (p.sprite === waterSprite) ringColor = "rgba(80, 180, 255, 0.60)";
        else if (p.sprite === thunderSprite) ringColor = "rgba(200, 220, 255, 0.65)";
        else if (p.sprite === toxicSprite) ringColor = "rgba(180, 255, 120, 0.55)";
        for (const [key, s] of shields) {
          const dx = p.x - s.x;
          const dy = p.y - s.y;
          if (dx * dx + dy * dy <= BARRIER_RADIUS * BARRIER_RADIUS) {
            s.flash = FLASH_MAX;   // ???????
            spawnShockRing(s.x, s.y, ringColor);
            if (!p.bounced) {
              p.bounced = true;
              p.x -= p.vx * 0.3;
              p.y -= p.vy * 0.3;
              p.vx *= -0.4;
              p.vy *= -0.4;
              p.life = Math.min(p.life, 12);
            } else {
              blocked = true;
            }
            break;
          }
        }
        if (blocked) {
          projectiles.splice(i, 1);
          continue;
        }

        const frameW = p.sprite.width / p.frameCount;
        const frameH = p.sprite.height;
        const sx = frameW * p.frame;
        ctx.drawImage(
          p.sprite,
          sx, 0, frameW, frameH,
          p.x - frameW / 2,
          p.y - frameH / 2,
          frameW, frameH
        );

        if (p.life <= 0) {
          projectiles.splice(i, 1);
        }
      }

      ctx.filter = "none";
      ctx.restore();
    }


    /****************************************************
     * 繝舌Μ繧｢謠冗判・ｽE・ｽE・ｽE・ｽEarrier1/2 繧ｹ繝励Λ繧､繝茨ｼ・
     * barrier1_1x9.png: 髢矩哩縺ｫ菴ｿ逕ｨ・ｽE・ｽE・ｽE・ｽ鬆・・ｽE・ｽ・ｽE・ｽ騾・・ｽE・ｽE逕滂ｼ・
     * barrier2_1x9.png: 邯ｭ謖∽ｸｭ繝ｫ繝ｼ繝励↓菴ｿ逕ｨ
     ****************************************************/
    const barrierOpenSprite = new Image(); // 髢具ｿｽE髢会ｼ磯・・ｽE・ｽE騾・・ｽE・ｽ・ｽE・ｽE
    const barrierLoopSprite = new Image(); // 邯ｭ謖√Ν繝ｼ繝・
    barrierOpenSprite.src = "ar_images/barrier1_1x9.png";
    barrierLoopSprite.src = "ar_images/barrier2_1x9.png";

    const BARRIER_FRAME_COUNT = 9;
    const BARRIER_FRAME_MS = 70; // 1繧ｳ繝槭≠縺溘ｊ邏・0ms
    const BARRIER_SIZE = 320;
    const BARRIER_RADIUS = BARRIER_SIZE * 0.45; // ?????
    const FLASH_DECAY = 0.08;       // ????????
    const FLASH_MAX = 0.6;          // ??????????

    // handKey -> { x, y, phase, frame, last, hold, flash }
    // phase: "opening" | "holding"
    const shields = new Map();

    function ensureShield(handKey, x, y, t) {
      let s = shields.get(handKey);
      if (!s) {
        s = { x, y, phase: "opening", frame: 0, last: t, hold: true, flash: 0, expireAt: t + SHIELD_GRACE_MS };
        shields.set(handKey, s);
        return;
      }
      s.x = x;
      s.y = y;
      s.hold = true;
      s.expireAt = t + SHIELD_GRACE_MS;
      // 髢峨§騾比ｸｭ縺ｧ蜀榊ｺｦ繝托ｿｽE縺ｫ縺ｪ縺｣縺溷ｴ蜷茨ｿｽE髢九″縺ｸ謌ｻ縺・
      if (s.phase === "closing") {
        s.phase = "opening";
        s.frame = Math.max(0, BARRIER_FRAME_COUNT - 1 - s.frame);
        s.last = t;
      }
    }

    function releaseShield(handKey) {
      // 隱､菴懷虚縺ｧ谿九ｋ縺ｮ繧帝∩縺代ｋ縺溘ａ蜊ｳ蠎ｧ縺ｫ豸医☆
      shields.delete(handKey);
    }

    function drawBarrierFrame(ctx, img, frameIndex, cx, cy, alpha = 0.9) {
      if (!img.complete || img.naturalWidth === 0) return;
      const frameW = img.width / BARRIER_FRAME_COUNT;
      const frameH = img.height;
      const sx = frameW * frameIndex;
      const sy = 0;
      const size = BARRIER_SIZE;
      const x = cx - size / 2;
      const y = cy - size / 2;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = "screen";
      ctx.drawImage(img, sx, sy, frameW, frameH, x, y, size, size);
      ctx.restore();
    }

    function spawnShockRing(x, y, color) {
      shockRings.push({ x, y, life: 0, max: 14, color });
    }

    function drawShockRings(ctx) {
      for (let i = shockRings.length - 1; i >= 0; i--) {
        const r = shockRings[i];
        const t = r.life / r.max;
        const radius = BARRIER_SIZE * (0.30 + 0.28 * t);
        const alpha = 0.45 * (1 - t);
        const lineW = 10 * (1 - t) + 2;
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.lineWidth = lineW;
        ctx.strokeStyle = r.color.replace(/,\s*0\.?[0-9]*\)$/g, ", " + alpha.toFixed(3) + ")");
        ctx.beginPath();
        ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        r.life++;
        if (r.life >= r.max) shockRings.splice(i, 1);
      }
    }

    function drawShields(ctx, t) {
      for (const [key, s] of shields) {
        if (s.flash === undefined) s.flash = 0;
        const step = Math.floor((t - s.last) / BARRIER_FRAME_MS);
        if (step > 0) {
          s.last = t;
          if (s.phase === "opening") {
            s.frame = Math.min(BARRIER_FRAME_COUNT - 1, s.frame + step);
            if (s.frame >= BARRIER_FRAME_COUNT - 1 && s.hold) {
              s.phase = "holding";
              s.frame = 0;
            }
          } else if (s.phase === "holding") {
            s.frame = (s.frame + step) % BARRIER_FRAME_COUNT;
          }
        }

        let sprite, frameIdx, alpha;
        if (s.phase === "opening") {
          sprite = barrierOpenSprite;
          frameIdx = s.frame;
          alpha = BARRIER_ALPHA_OPEN;
        }
        else { // holding
          sprite = barrierLoopSprite;
          frameIdx = s.frame;
          alpha = BARRIER_ALPHA_HOLD;
        }

        drawBarrierFrame(ctx, sprite, frameIdx, s.x, s.y, alpha);

        // ????????????
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = BARRIER_GLOW_ALPHA * (s.phase === "opening" ? 1 : 0.8);
        const glowR = BARRIER_SIZE * BARRIER_GLOW_SCALE * 0.5;
        const g2 = ctx.createRadialGradient(s.x, s.y, BARRIER_SIZE * 0.25, s.x, s.y, glowR);
        g2.addColorStop(0, "rgba(160, 220, 255, 0.8)");
        g2.addColorStop(1, "rgba(0, 120, 255, 0)");
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, glowR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // ????????????
        if (s.flash > 0) {
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          ctx.globalAlpha = s.flash;
          const g = ctx.createRadialGradient(s.x, s.y, BARRIER_SIZE * 0.1, s.x, s.y, BARRIER_SIZE * 0.55);
          g.addColorStop(0, "rgba(180, 240, 255, 0.9)");
          g.addColorStop(1, "rgba(0, 160, 255, 0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(s.x, s.y, BARRIER_SIZE * 0.55, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          s.flash = Math.max(0, s.flash - FLASH_DECAY);
        }
      }
    }

    /****************************************************
     * 繝｡繧､繝ｳ蜃ｦ逅・
     ****************************************************/
    window.onload = async () => {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7, // 隱､讀懶ｿｽE繧呈ｸ帙ｉ縺・
        minTrackingConfidence: 0.7
      });

      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 640,
        height: 480
      });
      camera.start();

      // 繧ｪ繝ｼ繝励Φ蛻､螳夲ｿｽE騾｣邯壹ヵ繝ｬ繝ｼ繝繧呈焚縺医ｋ
      const openCounters = new Map(); // handKey -> count

      function onResults(results) {
        const t = performance.now();

        // 1. 繧ｫ繝｡繝ｩ譏蜒上ｒ蟾ｦ蜿ｳ蜿崎ｻ｢縺励▽縺､繧｢繧ｹ繝壹け繝域ｯ皮ｶｭ謖√〒謠冗判
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);

        const videoW = video.videoWidth || 640;
        const videoH = video.videoHeight || 480;
        const scale = Math.min(canvas.width / videoW, canvas.height / videoH);
        const drawW = videoW * scale;
        const drawH = videoH * scale;
        const offsetX = (canvas.width - drawW) / 2;
        const offsetY = (canvas.height - drawH) / 2;

        ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
        ctx.restore();

        // 2. 繧ｨ繝輔ぉ繧ｯ繝域緒逕ｻ
        drawProjectiles(ctx, shields);
        drawShields(ctx, t);
        drawShockRings(ctx);

        // 3. 謇区､懶ｿｽE邨先棡繧抵ｿｽE逅・
        if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
          const seenHands = new Set();

          for (let i = 0; i < results.multiHandLandmarks.length; i++) {
            const lm = results.multiHandLandmarks[i];
            const handedness = results.multiHandedness[i].label; // "Right" / "Left"

            const states = getFingerStates(lm, handedness);
            const count = states.count;

            // 謇具ｿｽE蝓ｺ貅紋ｽ咲ｽｮ・ｽE・ｽE・ｽE・ｽ莠ｺ蟾ｮ縺玲欠莉倥￠譬ｹ・ｽE・ｽE・ｽE・ｽ縺ｨ蜈育ｫｯ・ｽE・ｽE・ｽE・ｽ蜷代″逕ｨ・ｽE・ｽE・ｽE・ｽE
            const baseX = lm[5].x * drawW + offsetX;
            const baseY = lm[5].y * drawH + offsetY;
            const tipX  = lm[8].x * drawW + offsetX;
            const tipY  = lm[8].y * drawH + offsetY;

            // 蜿崎ｻ｢蠕鯉ｿｽE繧ｹ繧ｯ繝ｪ繝ｼ繝ｳ蠎ｧ讓・
            const screenBaseX = canvas.width - baseX;
            const screenBaseY = baseY;
            const screenTipX  = canvas.width - tipX;
            const screenTipY  = tipY;

            // 蜷代″繝吶け繝医Ν・ｽE・ｽE・ｽE・ｽ謇具ｿｽE菴咲ｽｮ竊呈欠蜈茨ｼ・
            let dirX = screenTipX - screenBaseX;
            let dirY = screenTipY - screenBaseY;
            const len = Math.hypot(dirX, dirY) || 1;
            dirX /= len;
            dirY /= len;

            // 繝・・ｽE・ｽ・ｽE・ｽ繝・・ｽE・ｽ・ｽE・ｽ逕ｨ縺ｮ謨ｰ蟄苓｡ｨ遉ｺ
            ctx.font = "32px sans-serif";
            ctx.fillStyle = "rgba(255,255,255,0.95)";
            ctx.strokeStyle = "rgba(0,0,0,0.7)";
            ctx.lineWidth = 4;
            ctx.strokeText(count, screenBaseX + 20, screenBaseY - 24);
            ctx.fillText(count, screenBaseX + 20, screenBaseY - 24);

            // 菴咲ｽｮ繝橸ｿｽE繧ｫ繝ｼ
            ctx.beginPath();
            ctx.arc(screenBaseX, screenBaseY, 6, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,255,255,0.8)";
            ctx.fill();

            const handKey = `${handedness}_${i}`;
            const isOpenHand =
              states.index && states.middle && states.ring && states.pinky;
            const isPeace =
              states.index &&
              states.middle &&
              !states.ring &&
              !states.pinky;

            // ・ｽE・ｽp・ｽE・ｽ[ ・ｽE・ｽ・ｽE・ｽ ・ｽE・ｽV・ｽE・ｽ[・ｽE・ｽ・ｽE・ｽ・ｽE・ｽh・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ
            if (isOpenHand) {
              seenHands.add(handKey);
              const prev = openCounters.get(handKey) || 0;
              const nowCnt = Math.min(prev + 1, 10);
              openCounters.set(handKey, nowCnt);
              if (nowCnt >= 3) {
                ensureShield(handKey, screenBaseX, screenBaseY, t);
              }
            } else {
              openCounters.set(handKey, 0);
              const sh = shields.get(handKey);
              if (sh) {
                sh.hold = false;
                sh.expireAt = Math.max(sh.expireAt || 0, t + SHIELD_GRACE_MS);
              }
            }

            // ・ｽE・ｽw・ｽE・ｽ{・ｽE・ｽ・ｽE・ｽ・ｽE・ｽﾅ弾・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽi・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽ・ｽE・ｽt・ｽE・ｽ・ｽE・ｽ・ｽE・ｽj
            if (count === 0) {
              spawnProjectile(handKey, screenBaseX, screenBaseY, dirX, dirY, waterSprite, NINE_FRAME_COUNT, false);
            } else if (count === 1) {
              spawnProjectile(handKey, screenBaseX, screenBaseY, dirX, dirY, thunderSprite, NINE_FRAME_COUNT);
            } else if (count === 3) {
              spawnProjectile(handKey, screenBaseX, screenBaseY, dirX, dirY, toxicSprite, NINE_FRAME_COUNT);
            } else if (isPeace) {
              spawnProjectile(handKey, screenBaseX, screenBaseY, dirX, dirY, fireSprite, FIRE_FRAME_COUNT);
            }

          }

          // 繝托ｿｽE繧偵ｄ繧√◆謇具ｿｽE繧ｷ繝ｼ繝ｫ繝会ｿｽE繝輔ぉ繝ｼ繝峨い繧ｦ繝医∈
          for (const [key, sh] of shields) {
            if (!seenHands.has(key)) {
              sh.hold = false;
              sh.expireAt = Math.max(sh.expireAt || 0, t + SHIELD_GRACE_MS);
            }
          }
          for (const [key, sh] of Array.from(shields)) {
            if (!sh.hold && t > (sh.expireAt || 0)) {
              shields.delete(key);
              openCounters.delete(key);
            }
          }
        } else {
          // 謇九′蜈ｨ縺乗､懶ｿｽE縺輔ｌ縺ｪ縺・・ｽE・ｽ・ｽE・ｽ繝ｬ繝ｼ繝縺ｧ谿狗蕗繝舌Μ繧｢繧偵け繝ｪ繧｢
          const nowExp = t + SHIELD_GRACE_MS;
          for (const sh of shields.values()) {
            sh.hold = false;
            sh.expireAt = Math.max(sh.expireAt || 0, nowExp);
          }
          for (const [key, sh] of Array.from(shields)) {
            if (!sh.hold && t > (sh.expireAt || 0)) {
              shields.delete(key);
            }
          }
          openCounters.clear();
        }
      }
    };
  </script>
