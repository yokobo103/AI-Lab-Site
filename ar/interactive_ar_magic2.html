<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Hand Magic (Barrier & Fire)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    video {
      display: none;
    }
  </style>
</head>
<body>
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
  /****************************************************
   * 指の状態・本数を取得（左右判定つき）
   ****************************************************/
  function getFingerStates(landmarks, handedness) {
    let thumb = false;
    let index = false;
    let middle = false;
    let ring = false;
    let pinky = false;

    // 親指 x 方向で判定（左右で向きが逆）
    const thumbTip = landmarks[4];
    const thumbIP  = landmarks[3];
    if (handedness === "Right") {
      thumb = thumbTip.x < thumbIP.x - 0.02;
    } else {
      thumb = thumbTip.x > thumbIP.x + 0.02;
    }

    // 他4本は「tip が base より上」にあれば伸びている
    const above = (tipIdx, baseIdx) => {
      const tip  = landmarks[tipIdx];
      const base = landmarks[baseIdx];
      return tip.y < base.y - 0.01;
    };

    index  = above(8, 5);   // 人差し指
    middle = above(12, 9);  // 中指
    ring   = above(16, 13); // 薬指
    pinky  = above(20, 17); // 小指

    const count = [thumb, index, middle, ring, pinky].filter(Boolean).length;
    return { thumb, index, middle, ring, pinky, count };
  }

  /****************************************************
   * 炎の弾 管理（チョキ用）
   ****************************************************/
  const fireballs = [];
  const fireCooldown = {}; // 手ごとのクールダウン用

  function spawnFireball(handKey, x, y) {
    const now = performance.now();
    const last = fireCooldown[handKey] || 0;
    if (now - last < 120) return; // 連射しすぎ防止
    fireCooldown[handKey] = now;

    fireballs.push({ x, y, vx: 0, vy: -12, life: 60 });
  }

  function drawFireballs(ctx) {
    for (let i = fireballs.length - 1; i >= 0; i--) {
      const b = fireballs[i];
      b.x += b.vx;
      b.y += b.vy;
      b.life--;

      const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 40);
      grad.addColorStop(0, "rgba(255, 220, 120, 1)");
      grad.addColorStop(0.5, "rgba(255, 120, 0, 0.8)");
      grad.addColorStop(1, "rgba(255, 0, 0, 0.2)");

      ctx.beginPath();
      ctx.arc(b.x, b.y, 40, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      if (b.life <= 0) fireballs.splice(i, 1);
    }
  }

  /****************************************************
   * 水の弾 管理（グー用）
   ****************************************************/
  const waterballs = [];
  const waterCooldown = {}; // 手ごとのクールダウン用

  function spawnWaterball(handKey, x, y) {
    const now = performance.now();
    const last = waterCooldown[handKey] || 0;
    if (now - last < 160) return; // 連射しすぎ防止（炎よりちょい遅め）
    waterCooldown[handKey] = now;

    // 少しゆっくりめに上へ
    waterballs.push({ x, y, vx: 0, vy: -8, life: 70 });
  }

  function drawWaterballs(ctx) {
    for (let i = waterballs.length - 1; i >= 0; i--) {
      const b = waterballs[i];
      b.x += b.vx;
      b.y += b.vy;
      b.life--;

      const r = 45;
      const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
      grad.addColorStop(0,   "rgba(220, 240, 255, 1)");
      grad.addColorStop(0.4, "rgba(120, 190, 255, 0.9)");
      grad.addColorStop(1,   "rgba(0, 90, 255, 0.0)");

      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();

      if (b.life <= 0) waterballs.splice(i, 1);
    }
  }

  /****************************************************
   * 雷魔法 管理（1本指）※ダイナミック版
   ****************************************************/
  const lightningBolts = [];
  const lightningCooldown = {};

  function spawnLightning(handKey, x, y) {
    const now = performance.now();
    const last = lightningCooldown[handKey] || 0;
    if (now - last < 160) return; // 出しすぎ防止
    lightningCooldown[handKey] = now;

    lightningBolts.push({ x, y, life: 20 });
  }

  function drawLightningBolts(ctx) {
    for (let i = lightningBolts.length - 1; i >= 0; i--) {
      const b = lightningBolts[i];
      b.life--;

      const alpha = Math.max(0, b.life / 20);
      const len = 180;

      ctx.save();
      ctx.globalCompositeOperation = "screen";

      // 大きめのグロー
      const glowR = 90;
      const glowGrad = ctx.createRadialGradient(
        b.x,
        b.y - 30,
        0,
        b.x,
        b.y - 30,
        glowR
      );
      glowGrad.addColorStop(0,   `rgba(255,255,255,${0.9 * alpha})`);
      glowGrad.addColorStop(0.3, `rgba(255,255,150,${0.8 * alpha})`);
      glowGrad.addColorStop(1,   `rgba(80,80,255,0)`);

      ctx.beginPath();
      ctx.arc(b.x, b.y - 30, glowR, 0, Math.PI * 2);
      ctx.fillStyle = glowGrad;
      ctx.fill();

      // ジグザグのメイン稲妻
      const segments = 7;
      const pathPts = [];
      let sx = b.x;
      let sy = b.y - 40;
      pathPts.push({ x: sx, y: sy });

      for (let s = 1; s <= segments; s++) {
        const t = s / segments;
        const wobble = (1 - t) * 70; // 上の方は激しく揺れる
        const nx = b.x + (Math.random() - 0.5) * wobble;
        const ny = sy + len * t;
        pathPts.push({ x: nx, y: ny });
      }

      // 太い外側ストローク
      ctx.beginPath();
      ctx.moveTo(pathPts[0].x, pathPts[0].y);
      for (let p = 1; p < pathPts.length; p++) {
        ctx.lineTo(pathPts[p].x, pathPts[p].y);
      }
      ctx.lineWidth = 7;
      ctx.strokeStyle = `rgba(255,255,200,${0.9 * alpha})`;
      ctx.stroke();

      // 細いコア（白〜シアン）
      ctx.beginPath();
      ctx.moveTo(pathPts[0].x, pathPts[0].y);
      for (let p = 1; p < pathPts.length; p++) {
        ctx.lineTo(pathPts[p].x, pathPts[p].y);
      }
      ctx.lineWidth = 3;
      ctx.strokeStyle = `rgba(200,230,255,${1.0 * alpha})`;
      ctx.stroke();

      // 側枝の稲妻
      ctx.lineWidth = 4;
      ctx.strokeStyle = `rgba(255,255,180,${0.8 * alpha})`;
      for (let p = 1; p < pathPts.length - 1; p++) {
        if (Math.random() < 0.4) {
          const base = pathPts[p];
          const dir = Math.random() < 0.5 ? -1 : 1;
          const branchLen = 50 + Math.random() * 50;

          const bx = base.x + dir * (20 + Math.random() * 30);
          const by = base.y + branchLen;

          ctx.beginPath();
          ctx.moveTo(base.x, base.y);
          ctx.lineTo(bx, by);
          ctx.stroke();
        }
      }

      ctx.restore();

      if (b.life <= 0) {
        lightningBolts.splice(i, 1);
      }
    }
  }

  /****************************************************
   * 毒魔法 管理（3本指）※深い緑＆おどろおどろしい版
   ****************************************************/
  const poisonOrbs = [];
  const poisonCooldown = {};

  function spawnPoisonOrb(handKey, x, y) {
    const now = performance.now();
    const last = poisonCooldown[handKey] || 0;
    if (now - last < 200) return;
    poisonCooldown[handKey] = now;

    // ゆっくり漂う + 少しフラフラ
    const vx = (Math.random() - 0.5) * 2;
    const vy = -3 - Math.random() * 1.5;
    poisonOrbs.push({ x, y, vx, vy, life: 110 });
  }

  function drawPoisonOrbs(ctx) {
    for (let i = poisonOrbs.length - 1; i >= 0; i--) {
      const b = poisonOrbs[i];
      b.x += b.vx + (Math.random() - 0.5) * 0.8; // 少し揺らす
      b.y += b.vy;
      b.life--;

      const alpha = Math.max(0, b.life / 110);
      const t = 1 - alpha;

      // 脈動する半径
      const baseR = 50;
      const r = baseR + 12 * Math.sin(t * Math.PI * 4);

      ctx.save();
      ctx.globalCompositeOperation = "screen";

      // 深い緑のコア + 黒っぽい外側
      const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
      grad.addColorStop(0,   `rgba(190, 255, 190, ${1.0 * alpha})`);
      grad.addColorStop(0.3, `rgba(60, 200, 100, ${0.95 * alpha})`);
      grad.addColorStop(0.7, `rgba(0, 100, 40, ${0.7 * alpha})`);
      grad.addColorStop(1,   `rgba(0, 20, 0, 0)`);

      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // 黒緑の輪郭（おどろおどろしい感じ）
      ctx.lineWidth = 3;
      ctx.strokeStyle = `rgba(0, 40, 0, ${0.9 * alpha})`;
      ctx.stroke();

      // 外側にトゲトゲした瘴気
      ctx.lineWidth = 2;
      ctx.strokeStyle = `rgba(0, 120, 60, ${0.8 * alpha})`;
      const spikes = 10;
      for (let s = 0; s < spikes; s++) {
        const ang = (Math.PI * 2 * s) / spikes + Math.random() * 0.5;
        const innerR = r * (0.9 + Math.random() * 0.1);
        const outerR = r * (1.2 + Math.random() * 0.3);
        const ix = b.x + innerR * Math.cos(ang);
        const iy = b.y + innerR * Math.sin(ang);
        const ox = b.x + outerR * Math.cos(ang);
        const oy = b.y + outerR * Math.sin(ang);

        ctx.beginPath();
        ctx.moveTo(ix, iy);
        ctx.lineTo(ox, oy);
        ctx.stroke();
      }

      // 内側に小さな泡っぽい粒をいくつか
      const bubbles = 5;
      for (let k = 0; k < bubbles; k++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = r * Math.random() * 0.6;
        const bx = b.x + rad * Math.cos(ang);
        const by = b.y + rad * Math.sin(ang);

        ctx.beginPath();
        ctx.arc(bx, by, 4 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(210, 255, 210, ${0.9 * alpha})`;
        ctx.fill();
      }

      ctx.restore();

      if (b.life <= 0) {
        poisonOrbs.splice(i, 1);
      }
    }
  }

  /****************************************************
   * バリア描画（magic_shield と同じ PNG を使用）
   * パー維持中は貼りっぱなし、離したらフェードアウト
   ****************************************************/
  const shieldImg = new Image();
  shieldImg.src = "ar_images/shield_hex.png";

  const shields = new Map(); // handKey -> { x, y, start, hold, releaseAt }
  const BASE_SIZE = 320;     // 少し大きめに
  const POP_DURATION = 900;  // 立ち上がりをゆっくり
  const RELEASE_DURATION = 700;

  function ensureShield(handKey, x, y, t) {
    let s = shields.get(handKey);
    if (!s) {
      s = { x, y, start: t, hold: true, releaseAt: null };
      shields.set(handKey, s);
    }
    s.x = x;
    s.y = y;
    s.hold = true;      // パー継続中
  }

  function releaseShield(handKey, t) {
    const s = shields.get(handKey);
    if (s && s.hold) {
      s.hold = false;
      s.releaseAt = t;
    }
  }

  function drawShields(ctx, t) {
    if (!shieldImg.complete) return;

    for (const [key, s] of shields) {
      let scale, alpha;

      if (s.hold) {
        const p = Math.min(1, (t - s.start) / POP_DURATION);
        if (p < 1) {
          // 立ち上がりアニメ（ゆっくり）
          scale = 0.1 + (1 - 0.1) * p;
          alpha = p;
        } else {
          // 貼りっぱなし中はゆるく呼吸
          scale = 1.05 + Math.sin(t / 700) * 0.08;
          alpha = 0.9;
        }
      } else {
        const p = (t - s.releaseAt) / RELEASE_DURATION;
        if (p >= 1) {
          shields.delete(key);
          continue;
        }
        scale = 1.0 + 0.3 * p;
        alpha = 0.9 * (1 - p);
      }

      const size = BASE_SIZE * scale;
      const x = s.x - size / 2;
      const y = s.y - size / 2;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = "screen";
      ctx.drawImage(shieldImg, x, y, size, size);
      ctx.restore();
    }
  }

  /****************************************************
   * メイン処理
   ****************************************************/
  window.onload = async () => {
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const hands = new Hands({
      locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 640,
      height: 480
    });
    camera.start();

    function onResults(results) {
      const t = performance.now();

      // 1. カメラ映像を左右反転しつつアスペクト比維持で描画
      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);

      const videoW = video.videoWidth;
      const videoH = video.videoHeight;
      const scale = Math.min(canvas.width / videoW, canvas.height / videoH);
      const drawW = videoW * scale;
      const drawH = videoH * scale;
      const offsetX = (canvas.width - drawW) / 2;
      const offsetY = (canvas.height - drawH) / 2;

      ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
      ctx.restore();

      // 2. エフェクト描画
      drawFireballs(ctx);
      drawWaterballs(ctx);
      drawLightningBolts(ctx);
      drawPoisonOrbs(ctx);
      drawShields(ctx, t);

      // 3. 手検出結果を処理
      if (results.multiHandLandmarks) {
        const seenHands = new Set();

        for (let i = 0; i < results.multiHandLandmarks.length; i++) {
          const lm = results.multiHandLandmarks[i];
          const handedness = results.multiHandedness[i].label; // "Right" / "Left"

          const states = getFingerStates(lm, handedness);
          const count = states.count;

          // 手の基準位置（人差し指付け根）
          const hx = lm[5].x * drawW + offsetX;
          const hy = lm[5].y * drawH + offsetY;

          // 反転後のスクリーン座標
          const screenX = canvas.width - hx;
          const screenY = hy;

          // デバッグ用の数字表示
          ctx.font = "32px sans-serif";
          ctx.fillStyle = "rgba(255,255,255,0.95)";
          ctx.strokeStyle = "rgba(0,0,0,0.7)";
          ctx.lineWidth = 4;
          ctx.strokeText(count, screenX + 20, screenY - 24);
          ctx.fillText(count, screenX + 20, screenY - 24);

          // 位置マーカー
          ctx.beginPath();
          ctx.arc(screenX, screenY, 6, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0,255,255,0.8)";
          ctx.fill();

          // パー判定（親指除く4本が伸びている）
          const isOpenHand =
            states.index && states.middle && states.ring && states.pinky;

          // チョキ判定（人差し指・中指のみ伸び）
          const isPeace =
            states.index &&
            states.middle &&
            !states.ring &&
            !states.pinky;

          // グー判定（全部折れているとみなす）
          const isFist =
            !states.thumb &&
            !states.index &&
            !states.middle &&
            !states.ring &&
            !states.pinky;

          // 1本指（どの指でもOK）
          const isOneFinger = count === 1;

          // 3本指（パー＆チョキと被らないように）
          const isThreeFinger = count === 3 && !isOpenHand && !isPeace;

          const handKey = `${handedness}_${i}`;

          // パー → シールド発動
          if (isOpenHand) {
            seenHands.add(handKey);
            ensureShield(handKey, screenX, screenY, t);
          }

          // チョキ → 炎魔法発射
          if (isPeace) {
            spawnFireball(handKey, screenX, screenY - 20);
          }

          // グー → 水魔法発射
          if (isFist) {
            spawnWaterball(handKey, screenX, screenY - 10);
          }

          // 1本 → 雷魔法
          if (isOneFinger) {
            spawnLightning(handKey, screenX, screenY - 40);
          }

          // 3本 → 毒魔法
          if (isThreeFinger) {
            spawnPoisonOrb(handKey, screenX, screenY - 20);
          }
        }

        // 開いていない手はフェードアウトへ
        for (const key of shields.keys()) {
          if (!seenHands.has(key)) {
            releaseShield(key, t);
          }
        }
      }
    }
  };
</script>



</body>
</html>
